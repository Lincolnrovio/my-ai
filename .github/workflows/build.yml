name: Build Nexus AI
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify web app files
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          python -m json.tool manifest.json >/dev/null
